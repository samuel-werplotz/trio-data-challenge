# pgBackRest — stanza do TimescaleDB (banco transacional principal).
#
# repo1-type=s3 apontando para o MinIO: é o mesmo código-caminho que rodaria
# contra o S3 real na AWS. Trocar para produção é mudar endpoint, região e
# credencial — nenhuma linha de lógica muda. É o ponto do exercício.
#
# MinIO na 9000 DENTRO da rede Docker (a 9002 é só o mapeamento externo, que
# existe porque a 9000 do host já é do ClickHouse).

[global]
repo1-type=s3
repo1-s3-endpoint=minio:9000
repo1-s3-bucket=trio-backups
repo1-s3-region=us-east-1
repo1-s3-key=trio
repo1-s3-key-secret=trio12345
repo1-s3-uri-style=path
# O MinIO serve HTTPS com certificado auto-assinado (ver docker-compose).
# repo1-type=s3 sempre fala TLS: repo-storage-port tem default 443 e nao ha
# opcao de pedir HTTP puro. Em vez de desligar a verificacao, aponta o CA — e
# o mesmo mecanismo que validaria o certificado real do S3 em producao.
repo1-storage-ca-file=/etc/pgbackrest/minio-ca.crt
repo1-storage-port=9000
repo1-path=/timescaledb

# Retenção: 2 backups full. O terceiro expira o mais antigo junto com o WAL que
# só ele precisava. Em produção este número sai da janela de RPO exigida.
repo1-retention-full=2

# Compressão: zstd bate gzip em tempo e taxa para dado de banco.
compress-type=zst
compress-level=3

# 2 processos: a máquina tem 8,3 GB e o ambiente inteiro roda junto. Em produção
# subiria para o número de vCPUs.
process-max=2

start-fast=y
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[timescale]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
# O superusuario destas instancias e 'trio' (POSTGRES_USER do compose), nao
# 'postgres' — a imagem oficial nao cria o role 'postgres' quando POSTGRES_USER
# e outro. pgBackRest se conecta como este usuario para chamar
# pg_backup_start/stop, entao precisa ser superusuario de verdade.
pg1-user=trio
pg1-database=postgres
