###############################################################################
#  Trio Grupo Financeiro — Desafio Técnico: Engenheiro de Dados Sênior
#  docker-compose.yml — versão evoluída (15 serviços, S08)
#
#  Uso:
#    cp .env.example .env
#    docker compose --profile core up -d   # essencial (schema, seed, api)
#    docker compose --profile full up -d   # ambiente completo (+ pipeline CDC, observabilidade)
#
#  MinIO publica na 9002, não 9000: a 9000 é a porta nativa do ClickHouse.
#  Dentro da rede Docker os dois continuam em 9000 — só o mapeamento externo muda.
###############################################################################

x-common-env: &pg-common
  POSTGRES_USER: ${POSTGRES_USER:-trio}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trio2024}

services:
  # ===========================================================================
  #  1. TimescaleDB — banco transacional principal
  # ===========================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: trio-timescaledb
    restart: unless-stopped
    profiles: ["core", "full", "cdc-experimento"]
    # default de 64MB do Docker estoura em hash join grande (ex.: Q4 self-join
    # de S06, o anti-padrão medido de propósito na etapa 06) — sem isso a query
    # nem chega a rodar para ser medida.
    shm_size: "1gb"
    ports:
      - "5432:5432"
    environment:
      <<: *pg-common
      POSTGRES_DB: trio_transactions
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./init/timescaledb:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb,pg_stat_statements"
      - "-c"
      - "timescaledb.telemetry_level=off"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "pg_stat_statements.track=all"
      # archive_mode fica OFF ate a etapa E4 instalar o pgBackRest de fato.
      # Ligado apontando para um binario inexistente, o archive_command falha
      # com exit 127 a cada segmento; o Postgres nao recicla WAL nao-arquivado
      # e o pg_wal cresce sem limite (chegou a 17,7 GB neste ambiente).
      # Arquivamento quebrado e pior que arquivamento desligado: dá a ilusao
      # de ter PITR e ainda enche o disco. E4 religa junto com o repo do backup.
      - "-c"
      - "archive_mode=off"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trio} -d trio_transactions"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G

  # ===========================================================================
  #  2. PostgreSQL Legado — simula o banco que pode migrar para Aurora/RDS
  # ===========================================================================
  postgres-legado:
    image: postgres:16-bookworm
    container_name: trio-postgres-legado
    restart: unless-stopped
    profiles: ["core", "full"]
    ports:
      - "5433:5432"
    environment:
      <<: *pg-common
      POSTGRES_DB: trio_legado
    volumes:
      - postgres_legado_data:/var/lib/postgresql/data
      - ./init/postgres-legado:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "pg_stat_statements.track=all"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trio} -d trio_legado"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  # ===========================================================================
  #  3. ClickHouse — motor de dados para aplicações e consultas
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: trio-clickhouse
    restart: unless-stopped
    profiles: ["core", "full", "cdc-experimento"]
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-trio}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-trio2024}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_DB: trio_analytics
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./init/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 6G

  # ===========================================================================
  #  4. Grafana — dashboards e observabilidade
  # ===========================================================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: trio-grafana
    restart: unless-stopped
    profiles: ["core", "full"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./init/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres-legado:
        condition: service_healthy
      # prometheus NAO entra aqui: ele so existe no profile 'full', e o grafana
      # roda em 'core' e 'full'. Um depends_on para servico ausente do profile
      # faz o 'docker compose --profile core up' abortar — era o motivo de o
      # criterio nº 1 do PDF ("sobe sem erros") falhar. No profile full o
      # prometheus sobe junto de qualquer forma; o Grafana so o consulta via
      # datasource, entao nao precisa dele para iniciar.
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  #  5. seed — gerador dos 10M de transações sintéticas (desafio-1)
  # ===========================================================================
  seed:
    build:
      context: ./desafio-1/seed
    container_name: trio-seed
    profiles: ["core", "full"]
    environment:
      <<: *pg-common
    depends_on:
      timescaledb:
        condition: service_healthy
      postgres-legado:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

  # ===========================================================================
  #  8b. sync-worker — TimescaleDB -> ClickHouse por micro-batch (watermark)
  #  Pipeline PRINCIPAL da entrega. Substitui o cdc-consumer, que ficou no
  #  profile cdc-experimento como artefato da decisao de descartar o CDC.
  # ===========================================================================
  sync-worker:
    build:
      context: ./desafio-2/pipeline/sync-worker
    container_name: trio-sync-worker
    restart: unless-stopped
    profiles: ["core", "full"]
    ports:
      - "8001:8001"   # metricas Prometheus
    environment:
      <<: *pg-common
      PGHOST: timescaledb
      POSTGRES_DB: trio_transactions
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-trio}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-trio2024}
    depends_on:
      timescaledb:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  #  ARTEFATO DE DECISAO — profile "cdc-experimento", fora do caminho critico
  #
  #  A abordagem CDC (Debezium -> Redpanda -> consumidor) foi construida,
  #  medida e DESCARTADA: publish_via_partition_root nao funciona sobre
  #  hypertable. Uma hypertable do TimescaleDB nao e tabela particionada
  #  nativa do PostgreSQL (relkind='r', chunk com relispartition='f'), entao
  #  o parametro nao tem relacao pai/filho sobre a qual agir e as escritas
  #  em chunk nunca entram na publication.
  #
  #  Provado isolando a decodificacao logica, sem Debezium no circuito:
  #    pg_logical_slot_peek_binary_changes            -> 0 mudancas
  #    ALTER PUBLICATION ... ADD TABLE <chunk>        -> 6 mudancas na hora
  #
  #  Fica no repositorio porque o PDF 4.2 A.1 cobra "por que essa abordagem e
  #  nao as outras?" — e a resposta vale mais com a alternativa construida do
  #  que descartada no papel. Subir so com:  docker compose --profile cdc-experimento up
  #
  #  Pipeline real da entrega: micro-batch por watermark (sync-worker, E2).
  # ===========================================================================

  # ===========================================================================
  #  6. Redpanda — broker Kafka-compatível para o pipeline CDC (desafio-2)
  # ===========================================================================
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: trio-redpanda
    restart: unless-stopped
    profiles: ["cdc-experimento"]
    ports:
      - "9092:9092"
      - "9644:9644"
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G

  # ===========================================================================
  #  7. Debezium Connect — captura CDC do TimescaleDB (pgoutput)
  # ===========================================================================
  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: trio-debezium
    restart: unless-stopped
    profiles: ["cdc-experimento"]
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: trio-debezium
      CONFIG_STORAGE_TOPIC: trio_connect_configs
      OFFSET_STORAGE_TOPIC: trio_connect_offsets
      STATUS_STORAGE_TOPIC: trio_connect_status
    depends_on:
      timescaledb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1.5G

  # ===========================================================================
  #  8. cdc-consumer — Redpanda -> ClickHouse (desafio-2/pipeline/consumer, S05)
  # ===========================================================================
  cdc-consumer:
    build:
      context: ./desafio-2/pipeline/consumer
    container_name: trio-cdc-consumer
    restart: unless-stopped
    profiles: ["cdc-experimento"]
    ports:
      - "8001:8001"
    environment:
      <<: *pg-common
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-trio}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-trio2024}
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      debezium:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  #  9. ref-sync — batch 5 min, legado -> Dictionary do ClickHouse
  # ===========================================================================
  # profile 'pendente': o Dockerfile ainda nao existe (etapa E3). Enquanto
  # estiver aqui, 'up --profile core|full' nao tenta buildar e nao quebra.
  # Ao implementar, devolver para ["full"].
  ref-sync:
    build:
      context: ./desafio-2/pipeline/ref-sync
    container_name: trio-ref-sync
    restart: unless-stopped
    profiles: ["pendente"]
    ports:
      - "8002:8002"
    environment:
      <<: *pg-common
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-trio}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-trio2024}
    depends_on:
      postgres-legado:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================================================
  #  10. api — serve consultas ClickHouse à aplicação (desafio-1/desafio-2)
  # ===========================================================================
  # profile 'pendente' ate a etapa E3 criar o Dockerfile (requisito PDF 3.2 C.5:
  # ClickHouse servindo uma aplicacao, nao so dashboards). Voltar para ["core","full"].
  api:
    build:
      context: ./desafio-2/pipeline/api
    container_name: trio-api
    restart: unless-stopped
    profiles: ["pendente"]
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-trio}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-trio2024}
    depends_on:
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  #  11. Prometheus — coleta métricas do pipeline e dos exporters
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: trio-prometheus
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "9090:9090"
    volumes:
      - ./init/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 1G

  # ===========================================================================
  #  12. pg-exporter-ts — métricas do TimescaleDB para o Prometheus
  # ===========================================================================
  pg-exporter-ts:
    image: prometheuscommunity/postgres-exporter
    container_name: trio-pg-exporter-ts
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-trio}:${POSTGRES_PASSWORD:-trio2024}@timescaledb:5432/trio_transactions?sslmode=disable"
    depends_on:
      timescaledb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # ===========================================================================
  #  13. pg-exporter-legado — métricas do PostgreSQL legado para o Prometheus
  # ===========================================================================
  pg-exporter-legado:
    image: prometheuscommunity/postgres-exporter
    container_name: trio-pg-exporter-legado
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "9188:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-trio}:${POSTGRES_PASSWORD:-trio2024}@postgres-legado:5432/trio_legado?sslmode=disable"
    depends_on:
      postgres-legado:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # ===========================================================================
  #  14. minio — destino S3-compatível do backup (pgBackRest / clickhouse-backup)
  #  Publica na 9002 externamente: a 9000 é a porta nativa do ClickHouse.
  # ===========================================================================
  minio:
    image: minio/minio
    container_name: trio-minio
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-trio12345}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  #  15. backup — pgBackRest / clickhouse-backup agendado (desafio-3/backup)
  # ===========================================================================
  # profile 'pendente' ate a etapa E4 (pgBackRest 2 stanzas + clickhouse-backup).
  # E4 tambem religa o archive_mode do timescaledb, hoje off por falta do binario.
  backup:
    build:
      context: ./desafio-3/backup
    container_name: trio-backup
    profiles: ["pendente"]
    environment:
      <<: *pg-common
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-trio}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-trio2024}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-trio12345}
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  timescaledb_data:
    driver: local
  postgres_legado_data:
    driver: local
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: trio-data-network
    driver: bridge
