# =============================================================================
#  Grafana — Provisioning de Datasources
#  Todos os bancos da Trio pré-configurados para uso imediato
# =============================================================================

apiVersion: 1

datasources:
  # TimescaleDB — Banco transacional principal
  - name: TimescaleDB
    uid: trio-timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: trio_transactions
    user: trio
    secureJsonData:
      password: trio2024
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: true

  # PostgreSQL Legado
  - name: PostgreSQL Legado
    uid: trio-legado
    type: postgres
    access: proxy
    url: postgres-legado:5432
    database: trio_legado
    user: trio
    secureJsonData:
      password: trio2024
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
    editable: true

  # Prometheus — métricas de aplicação (os 3 workers Python) e dos exporters.
  # É a fonte dos dashboards de Pipeline e das séries de infra; os painéis que
  # consultam dado de negócio seguem indo direto nos bancos abaixo.
  # UID fixo: os dashboards provisionados referenciam a datasource por UID, e
  # um UID gerado aleatoriamente quebraria os painéis a cada recriação.
  - name: Prometheus
    uid: trio-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 15s
    editable: true

  # ClickHouse — Aplicações e consultas
  - name: ClickHouse
    uid: trio-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: trio
      defaultDatabase: trio_analytics
    secureJsonData:
      password: trio2024
    editable: true
